<!doctype html>
<html lang="en">

<head>
  <title>This is Bootstrap Enabled Page</title>
  <meta charset="utf-8">

  <!-- Bootstrap for visual browsers only -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" media="screen">
</head>

<body class="bg-light">

  <header class="container mt-4">
    <h1>My Custom Search HTML Page</h1>
  </header>

  <form class="container mt-3" action="/lite/" method="get">
    <div class="d-flex gap-2">
      <label for="q" class="visually-hidden">Search</label>
      <input type="text" name="q" id="q" class="form-control">
      <input type="submit" value="Search" class="btn btn-primary">
    </div>
  </form>

  <nav class="container mt-2">
    <p>
      <a href="/lite/">Lite</a> |
      <a href="/html/">HTML</a> |
      <a href="/settings/">Settings</a>
    </p>
  </nav>

  <hr class="container">

  <main class="container mt-4">

    <article class="bg-white p-3 rounded border mb-3">
      <h3 class="mb-1">
        <a href="#">Example Domain</a>
      </h3>
      <p class="text-success mb-1">example.com</p>
      <p>This domain is for use in illustrative examples.</p>
    </article>

  </main>

</body>

</html>
